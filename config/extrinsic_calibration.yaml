# ====================================================================
# Buggy Extrinsic Calibration & Transformation Reference Parameters
# Vehicle: Autonomous Buggy
# ====================================================================

# 1. Coordinate Frames Definition (ROS REP-103 Standard):
#    +X: Forward (direction of travel)
#    +Y: Left
#    +Z: Up

# --------------------------------------------------------------------
# 2. Automotive Standard: Sensors with respect to base_link (Rear Axle Center)
# --------------------------------------------------------------------
base_link_to_sensors:
  imu_link:
    translation: [0.0109, 0.0000, 0.5004]    # [m]
    rotation_rpy_deg: [0.0, 0.0, 0.0]        # [deg]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

  velodyne:
    translation: [2.4779, 0.0000, 1.6866]    # [m]
    rotation_rpy_deg: [0.0, 10.0, 0.0]       # [deg] (10 degree pitch)
    quaternion_xyzw: [0.0, 0.087156, 0.0, 0.996195]

  front_left_sick:
    translation: [3.4434, 0.5610, 0.3606]    # [m]
    rotation_rpy_deg: [0.0, 0.0, 45.0]       # [deg] (facing 45 deg left)
    quaternion_xyzw: [0.0, 0.0, 0.382683, 0.923880]

  front_right_sick:
    translation: [3.4434, -0.5610, 0.3606]   # [m]
    rotation_rpy_deg: [0.0, 0.0, -45.0]      # [deg] (facing 45 deg right)
    quaternion_xyzw: [0.0, 0.0, -0.382683, 0.923880]

  back_center_sick:
    translation: [-0.7880, 0.0000, 0.3606]   # [m]
    rotation_rpy_deg: [0.0, 0.0, 180.0]      # [deg] (facing rear)
    quaternion_xyzw: [0.0, 0.0, 1.0, 0.0]

  front_camera_body:
    translation: [1.3894, 0.3200, 0.5880]    # [m] (pushed 15cm back, shifted 7cm right)
    rotation_rpy_deg: [0.0, 0.0, 0.0]        # [deg]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

  # ZED X Right Camera Optical Frame (active for hallway viewpoint)
  zedx_right_camera_optical:
    translation: [1.3894, 0.2600, 0.5880]    # [m] (includes -60mm baseline)
    rotation_rpy_deg: [-80.0, 0.0, -90.0]
    quaternion_xyzw: [-0.455, 0.455, -0.542, 0.542]

# --------------------------------------------------------------------
# 3. Direct Sensor-to-Sensor Extrinsic Matrices (Master = Velodyne VLP-16)
#    Used for LiDAR Odometry (LIO), Camera-LiDAR Pointcloud Colorization
# --------------------------------------------------------------------
velodyne_to_sensors:
  # T_velo_to_imu (4x4 Homogeneous Transformation Matrix)
  velodyne_to_imu:
    translation: [-2.223539, 0.000000, -1.596569]
    rotation_rpy_deg: [0.0, -10.0, 0.0]
    quaternion_xyzw: [0.0, -0.087156, 0.0, 0.996195]
    transform_matrix_4x4:
      - [0.984808,  0.000000, -0.173648, -2.223539]
      - [0.000000,  1.000000,  0.000000,  0.000000]
      - [0.173648,  0.000000,  0.984808, -1.596569]
      - [0.000000,  0.000000,  0.000000,  1.000000]

  # T_velo_to_camera (Front Bumper Camera relative to 3D LiDAR)
  velodyne_to_camera_body:
    translation: [1.352747, 0.000000, -1.110265]
    rotation_rpy_deg: [0.0, -10.0, 0.0]
    quaternion_xyzw: [0.0, -0.087156, 0.0, 0.996195]
    transform_matrix_4x4:
      - [0.984808,  0.000000, -0.173648,  1.352747]
      - [0.000000,  1.000000,  0.000000,  0.000000]
      - [0.173648,  0.000000,  0.984808, -1.110265]
      - [0.000000,  0.000000,  0.000000,  1.000000]

  # T_velo_to_camera_optical (ZED X Right Camera: [u, v, 1]^T = K * T * [X, Y, Z, 1]^T)
  velodyne_to_camera_optical:
    translation: [1.586000, 0.260000, -1.053000]
    quaternion_xyzw: [-0.455000, 0.455000, -0.542000, 0.542000]
    transform_matrix_4x4:
      - [ 0.000000, -1.000000,  0.000000,  0.260000]
      - [ 0.173648,  0.000000, -0.984808, -1.053000]
      - [ 0.984808,  0.000000,  0.173648,  1.586000]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]

  # T_velo_to_front_left_sick (For multi-LiDAR pointcloud fusion)
  velodyne_to_sick_front_left:
    translation: [1.181089, 0.561000, -1.138198]
    quaternion_xyzw: [-0.033353, -0.080521, 0.381227, 0.920364]

  # T_velo_to_front_right_sick (For multi-LiDAR pointcloud fusion)
  velodyne_to_sick_front_right:
    translation: [1.181089, -0.561000, -1.138198]
    quaternion_xyzw: [0.033353, -0.080521, -0.381227, 0.920364]
